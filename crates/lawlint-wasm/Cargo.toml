[package]
name = "lawlint-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for the lawlint linting engine"
repository = "https://github.com/sethtjf/lawlint"

[lib]
# rlib so native unit tests (`cargo test -p lawlint-wasm`) can link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
lawlint-core = { path = "../lawlint-core" }
serde.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
serde_json.workspace = true

[package]
name = "lawlint-desktop"
version = "0.10.0"
edition = "2021"
license = "MIT"
description = "Offline desktop application for lawlint"
build = "build.rs"

[lib]
name = "lawlint_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lawlint-core = { path = "../../../crates/lawlint-core" }
lawlint-docx = { path = "../../../crates/lawlint-docx" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[dev-dependencies]
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[workspace]

name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  # The shared group intentionally lets the post-publish deployment supersede
  # the main-push deployment that may have started before artifacts existed.
  # A later main push can cancel it, but that run re-reads latest/VERSION and
  # converges on the same published release.
  group: deploy-website
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Astro site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Add WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Blume's CLI runs under Node (its bin has a `node` shebang) and requires
      # 22.12+, as does the Astro 7 it generates against.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin website downloads to the published release
        shell: bash
        run: |
          set -euo pipefail
          version="$(curl --fail --location --silent --show-error \
            https://assets.lawlint.com/downloads/latest/VERSION | tr -d '\r\n')"
          case "$version" in
            ""|[!A-Za-z0-9]*|*[!A-Za-z0-9._+-]*|*..*)
              echo "::error::Published download version is invalid."
              exit 1
              ;;
          esac
          echo "PUBLIC_DOWNLOAD_VERSION=$version" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run --cwd apps/website check
      - run: bun run --cwd apps/website validate
      - run: bun run build

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required deployment secret: $name"
              exit 1
            fi
          done

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          workingDirectory: apps/website
          command: deploy --config wrangler.jsonc

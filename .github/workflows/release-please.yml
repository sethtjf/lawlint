name: Release Please

# Release-PR flow (compatible with the "Protect default branch" ruleset, which
# requires every change to main — including version bumps — to arrive via PR):
#
#   feat/fix PRs merge to main
#     -> release-please maintains a "chore: release X.Y.Z" PR that bumps the
#        version (Cargo.toml + Cargo.lock + manifest) and updates CHANGELOG.md
#     -> a human reviews and merges that release PR (a normal PR, so the ruleset
#        is satisfied — nothing is force-pushed to main and no bypass is needed)
#     -> on that merge, release-please creates the vX.Y.Z tag + GitHub Release,
#        and this workflow calls release.yml to build and publish CLI artifacts
#        artifacts for the tagged commit.
#
# A tag created by GITHUB_TOKEN does not itself trigger release.yml's tag push
# event, which is why the publish job invokes it directly via workflow_call.

on:
  push:
    branches:
      - main
  # Manual lever: run release-please on demand (e.g. if a merge commit happened
  # to carry a CI-skip token and no push run fired). Opens/refreshes the release PR.
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  # Safety net behind the PR-time check in ci.yml, for messages edited in the
  # merge box after CI ran. Deliberately a separate job: a bad message must not
  # block release-please from releasing the *good* commits around it, so this
  # only turns the workflow red. It answers "why is there no release PR?"
  # immediately, instead of at the next release.
  commit-messages:
    name: Commit messages are parseable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check every commit since the last release
        run: |
          version=$(jq -r '."."' .github/.release-please-manifest.json)
          bun run scripts/check-commit-messages.mjs --since "v$version"

  release-please:
    name: Maintain release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # Keep release-PR maintenance independent from artifact publication. A
  # release-please invocation may create a tag/release and open the next
  # release PR in the same run; a failure while synchronizing that PR must not
  # suppress publishing artifacts for the tag that was already created.
  sync-release-pr:
    name: Synchronize release PR Cargo.lock
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Find release PR branch
        id: release-pr
        env:
          RELEASE_PR: ${{ needs.release-please.outputs.pr }}
        run: |
          branch=$(node -e 'process.stdout.write(JSON.parse(process.env.RELEASE_PR).headBranchName)')
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Synchronize Cargo.lock release versions
        run: node scripts/sync-cargo-lock-version.mjs
      - name: Verify locked Cargo metadata
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Test synchronized release workspace
        run: cargo test --workspace --locked
      - name: Commit synchronized Cargo.lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_PR_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already synchronized."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock release version"
          git push origin "HEAD:${RELEASE_PR_BRANCH}"
          gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_PR_BRANCH"

  publish:
    name: Publish artifacts
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # The main push also starts deploy.yml, but that deployment can race the
  # artifact upload and pin the site to the previous release. Re-run it after
  # publish completes so the direct-download links resolve to this release.
  deploy-site:
    name: Deploy website after release
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
